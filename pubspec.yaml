name: mero
description: An app to identify endangered species using Gemma 4 local model
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.5.4
  flutter_gemma: ^0.15.0
  camera: ^0.12.0+1
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  http: ^1.1.0
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_dotenv: ^6.0.1
  permission_handler: ^12.0.1
  url_launcher: ^6.2.0
  image: ^4.2.0
  share_plus: ^13.1.0
  flutter_local_notifications: ^17.2.2
  google_fonts: ^6.2.1
  flutter_markdown_plus_latex: ^1.0.5
  flutter_markdown_plus: ^1.0.5
  markdown: ^7.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/species_data.zip
    - assets/data/visual_features_embeddings.json
    - .env

  # For iOS, need to set minimum version
  # Add to ios/Podfile: platform :ios, '16.0'
  
  # For Android, need OpenGL support for GPU
  # Add to android/app/src/main/AndroidManifest.xml:
  # <uses-native-library android:name="libOpenCL.so" android:required="false"/>
