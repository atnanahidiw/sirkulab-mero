name: mero
description: An app to identify endangered species using Gemma 4 local model
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.5.4
  flutter_gemma: ^0.16.1
  camera: ^0.12.0+1
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  http: ^1.1.0
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  permission_handler: ^12.0.1
  url_launcher: ^6.2.0
  image: ^4.2.0
  share_plus: ^13.1.0
  flutter_onnxruntime: ^1.4.1
  flutter_local_notifications: ^17.2.2
  google_fonts: ^6.2.1
  flutter_markdown_plus_latex: ^1.0.5
  flutter_markdown_plus: ^1.0.5
  markdown: ^7.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  shared_preferences: ^2.3.2
  drift: ^2.33.0
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/species_data.sqlite
    # Bundled vision model (Talk2DINO, int8 ONNX) + precomputed attribute
    # label-text embeddings. Produced offline; see docs/smaller-footprint-pipeline/.
    - assets/models/dino_image_encoder.onnx
    - assets/models/dino_attribute_embeddings.json
    - assets/models/visual_group_prototypes.pb
    - assets/models/visual_group_prototypes.proto
    # v2 check_visual_evidence — runtime text encoder + CLIP BPE tokenizer
    - assets/models/dino_text_encoder.onnx
    - assets/models/clip_vocab.json
    - assets/models/clip_merges.txt

  # For iOS, need to set minimum version
  # Add to ios/Podfile: platform :ios, '16.0'
  
  # For Android, need OpenGL support for GPU
  # Add to android/app/src/main/AndroidManifest.xml:
  # <uses-native-library android:name="libOpenCL.so" android:required="false"/>
